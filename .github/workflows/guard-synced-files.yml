name: "Guard synced files"

# docs/ y openapi/ se editan solo en el repo backend (SPEC REP-01).
# Este check falla si un PR los modifica desde una rama distinta a sync/backend.
on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verificar que no se editaron archivos sincronizados
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guard-synced-files.sh "$HEAD_REF" "origin/$BASE_REF"
